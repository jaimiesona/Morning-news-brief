name: Morning News Brief

on:
  schedule:
    # Always UTC, and GitHub does not follow British Summer Time.
    # 06:30 UTC = 07:30 in London during BST, 06:30 in winter (GMT).
    # Change this line to move the delivery time.
    - cron: "30 6 * * *"
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needed to commit the record of which stories have already been sent.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send brief
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional summariser settings — leave the secrets unset to stay free.
          SUMMARISER: ${{ vars.SUMMARISER || 'extractive' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          # Tuning without touching code: set these as repository variables.
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '26' }}
          SECTIONS: ${{ vars.SECTIONS || 'ai,politics,technology,funding' }}
          GOOGLE_NEWS_LOCALE: ${{ vars.GOOGLE_NEWS_LOCALE || 'GB:en' }}
          GOOGLE_NEWS_LANGUAGE: ${{ vars.GOOGLE_NEWS_LANGUAGE || 'en-GB' }}
          GOOGLE_NEWS_COUNTRY: ${{ vars.GOOGLE_NEWS_COUNTRY || 'GB' }}
        run: python main.py

      - name: Remember which stories were sent
        # A runner's disk is wiped after every run, so the record of what has
        # already gone out has to live in the repository itself.
        if: success()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Record stories sent on $(date -u +%Y-%m-%d) [skip ci]"
            git push
          else
            echo "No change to the story record."
          fi

      - name: Keep a copy of the rendered brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-html
          path: output/*.html
          if-no-files-found: ignore
          retention-days: 14
